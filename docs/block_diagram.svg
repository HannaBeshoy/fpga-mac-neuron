<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>MAC neuron accelerator: block diagram</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#344052"/>
    </marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4f8a"/>
    </marker>
    <style>
      .box  { fill: #ffffff; stroke: #344052; stroke-width: 1.4; }
      .inp  { fill: #f3f6fa; stroke: #617084; stroke-width: 1.3; stroke-dasharray: 5 3; }
      .ctl  { fill: #e2ebf6; stroke: #1f4f8a; stroke-width: 1.8; }
      .reg  { fill: #f3f6fa; stroke: #344052; stroke-width: 1.4; }
      .t    { font-size: 14px; font-weight: 600; fill: #131a24; }
      .s    { font-size: 12px; fill: #4b5768; }
      .lab  { font-size: 11.5px; fill: #1f4f8a; font-weight: 600; }
      .w    { stroke: #344052; stroke-width: 1.5; fill: none; }
      .c    { stroke: #1f4f8a; stroke-width: 1.3; fill: none; stroke-dasharray: 4 3; }
    </style>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>

  <!-- inputs -->
  <rect class="inp" x="20" y="40" width="170" height="70" rx="6"/>
  <text class="t" x="105" y="68" text-anchor="middle">Switches</text>
  <text class="s" x="105" y="88" text-anchor="middle">inputs x0–x3, 4 bits each</text>

  <rect class="inp" x="20" y="150" width="170" height="70" rx="6"/>
  <text class="t" x="105" y="178" text-anchor="middle">BTNU / BTND</text>
  <text class="s" x="105" y="198" text-anchor="middle">weight set 0..7</text>

  <rect class="box" x="230" y="150" width="170" height="70" rx="6"/>
  <text class="t" x="315" y="176" text-anchor="middle">Weight ROM</text>
  <text class="s" x="315" y="194" text-anchor="middle">8 x 26 bits, $readmemb</text>
  <text class="s" x="315" y="210" text-anchor="middle">w3..w0 and threshold T</text>

  <rect class="reg" x="440" y="40" width="150" height="70" rx="6"/>
  <text class="t" x="515" y="68" text-anchor="middle">x, w, T registers</text>
  <text class="s" x="515" y="88" text-anchor="middle">snapshot at start</text>

  <!-- datapath -->
  <rect class="box" x="440" y="150" width="150" height="70" rx="6"/>
  <text class="t" x="515" y="178" text-anchor="middle">2 multiplexers</text>
  <text class="s" x="515" y="198" text-anchor="middle">pick w[i], x[i]</text>

  <rect class="box" x="440" y="260" width="150" height="80" rx="6"/>
  <text class="t" x="515" y="288" text-anchor="middle">Multiplier</text>
  <text class="s" x="515" y="306" text-anchor="middle">4 x 4 shift-and-add</text>
  <text class="s" x="515" y="322" text-anchor="middle">constant time (Lab 10)</text>

  <rect class="reg" x="640" y="260" width="150" height="80" rx="6"/>
  <text class="t" x="715" y="288" text-anchor="middle">Accumulator</text>
  <text class="s" x="715" y="306" text-anchor="middle">acc = acc + w[i]·x[i]</text>
  <text class="s" x="715" y="322" text-anchor="middle">10 bits (max 900)</text>

  <rect class="reg" x="640" y="380" width="150" height="70" rx="6"/>
  <text class="t" x="715" y="408" text-anchor="middle">y, fire registers</text>
  <text class="s" x="715" y="428" text-anchor="middle">fire = (y ≥ T)</text>

  <rect class="box" x="830" y="260" width="150" height="80" rx="6"/>
  <text class="t" x="905" y="288" text-anchor="middle">bin2bcd x 2</text>
  <text class="s" x="905" y="306" text-anchor="middle">double dabble</text>
  <text class="s" x="905" y="322" text-anchor="middle">y and T in decimal</text>

  <rect class="inp" x="830" y="380" width="150" height="70" rx="6"/>
  <text class="t" x="905" y="406" text-anchor="middle">Display, LEDs</text>
  <text class="s" x="905" y="424" text-anchor="middle">K.TTT.YYYY</text>
  <text class="s" x="905" y="440" text-anchor="middle">LED0 = fire</text>

  <!-- controller -->
  <rect class="ctl" x="230" y="380" width="170" height="90" rx="6"/>
  <text class="t" x="315" y="408" text-anchor="middle">Controller (ASM)</text>
  <text class="s" x="315" y="426" text-anchor="middle">IDLE, MSTART,</text>
  <text class="s" x="315" y="442" text-anchor="middle">MWAIT, DONE</text>
  <text class="s" x="315" y="458" text-anchor="middle">index i = 0..3</text>

  <rect class="inp" x="20" y="390" width="170" height="70" rx="6"/>
  <text class="t" x="105" y="416" text-anchor="middle">Clocking Wizard</text>
  <text class="s" x="105" y="434" text-anchor="middle">100 → 50 MHz, locked</text>
  <text class="s" x="105" y="450" text-anchor="middle">+ ticks every 10.5 ms</text>

  <!-- data wires -->
  <path class="w" d="M190,75 H436" marker-end="url(#ah)"/>
  <path class="w" d="M190,185 H226" marker-end="url(#ah)"/>
  <path class="w" d="M400,185 H420 V95 H436" marker-end="url(#ah)"/>
  <path class="w" d="M515,110 V146" marker-end="url(#ah)"/>
  <path class="w" d="M515,220 V256" marker-end="url(#ah)"/>
  <path class="w" d="M590,300 H636" marker-end="url(#ah)"/>
  <text class="lab" x="612" y="292" text-anchor="middle">8 bits</text>
  <path class="w" d="M715,340 V376" marker-end="url(#ah)"/>
  <path class="w" d="M790,415 H810 V300 H826" marker-end="url(#ah)"/>
  <path class="w" d="M905,340 V376" marker-end="url(#ah)"/>
  <path class="w" d="M590,60 H900 V256" marker-end="url(#ah)"/>
  <text class="lab" x="745" y="54" text-anchor="middle">T, weight set</text>

  <!-- control wires -->
  <path class="c" d="M190,425 H226" marker-end="url(#ahc)"/>
  <text class="lab" x="208" y="418" text-anchor="middle">tick</text>
  <path class="c" d="M400,395 H420 V330 H436" marker-end="url(#ahc)"/>
  <text class="lab" x="420" y="320" text-anchor="end">mst</text>
  <path class="c" d="M440,335 H410 V380" marker-end="url(#ahc)"/>
  <text class="lab" x="362" y="352" text-anchor="end">mdone</text>
  <path class="c" d="M400,445 H620 V320 H636" marker-end="url(#ahc)"/>
  <text class="lab" x="520" y="438" text-anchor="middle">clr, add</text>
  <path class="c" d="M400,460 H660 V454" marker-end="url(#ahc)"/>
  <text class="lab" x="520" y="476" text-anchor="middle">ld_y</text>
  <path class="c" d="M370,380 V240 H425 V205 H436" marker-end="url(#ahc)"/>
  <text class="lab" x="378" y="262">i, snap</text>

  <text class="s" x="20" y="530">Solid lines: data. Dashed blue lines: control signals from the ASM controller (docs/asm_chart.svg).</text>
</svg>
